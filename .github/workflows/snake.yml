name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # First colour in color_dots is the EMPTY cell.
          # Dark: a visible slate (#2d3343) so empty cells don't vanish on GitHub's #0d1117.
          outputs: |
            dist/snake.svg?color_snake=#10B981&color_dots=#E2E8F0,#DDD6FE,#C4B5FD,#A78BFA,#7C3AED
            dist/snake-dark.svg?color_snake=#10B981&color_dots=#2d3343,#4C3A8A,#6D54C9,#8F73F0,#A78BFA

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
